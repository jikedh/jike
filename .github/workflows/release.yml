name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true
          key: windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          $cargoVersion = $cargoVersion.Matches[0].Groups[1].Value

          if ($packageVersion -ne $tauriVersion) {
            throw "package.json version '$packageVersion' does not match src-tauri/tauri.conf.json version '$tauriVersion'."
          }

          if ($packageVersion -ne $cargoVersion) {
            throw "package.json version '$packageVersion' does not match src-tauri/Cargo.toml version '$cargoVersion'."
          }

          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match app version '$packageVersion'. Expected tag: '$expectedTag'."
          }

          Write-Host "Release version validated: $packageVersion / $expectedTag"

      - name: Build Tauri bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          npm run build:tauri

      - name: Print generated bundle files
        if: always()
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          if (Test-Path $bundleRoot) {
            Get-ChildItem $bundleRoot -Recurse -File |
              Sort-Object FullName |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize
          } else {
            Write-Host "Bundle output directory does not exist: $bundleRoot"
          }

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tauri-bundles
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

      - name: Publish release assets and latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $releaseTitle = "即刻 v$version"
          $releaseNotes = "自动发布 Windows 安装包和 Tauri updater manifest。"
          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          $manifestDir = Join-Path $env:RUNNER_TEMP "tauri-updater-manifest"
          $manifestPath = Join-Path $manifestDir "latest.json"

          if (-not (Test-Path $bundleRoot)) {
            throw "Tauri bundle output directory was not found: $bundleRoot"
          }

          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

          $nsisDir = Join-Path $bundleRoot "nsis"
          $msiDir = Join-Path $bundleRoot "msi"

          $installer = $null
          if (Test-Path $nsisDir) {
            $installer = Get-ChildItem $nsisDir -Recurse -File -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "webview2|WebView2" } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $installer -and (Test-Path $msiDir)) {
            $installer = Get-ChildItem $msiDir -Recurse -File -Filter "*.msi" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $installer) {
            throw "No Windows installer was found under $bundleRoot."
          }

          $signatureFile = Get-ChildItem $installer.DirectoryName -File |
            Where-Object { $_.Name -eq "$($installer.Name).sig" -or $_.Name -eq "$($installer.BaseName).sig" } |
            Select-Object -First 1

          if (-not $signatureFile) {
            throw "No signature file was found for installer '$($installer.FullName)'. Expected '$($installer.Name).sig' or '$($installer.BaseName).sig'."
          }

          $signature = (Get-Content $signatureFile.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Signature file is empty: $($signatureFile.FullName)"
          }

          $releaseExists = $true
          gh release view $tag --json tagName,isDraft,isPrerelease 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release edit $tag --title $releaseTitle --notes $releaseNotes --draft=false --prerelease=false --latest
          } else {
            gh release create $tag --target $env:GITHUB_SHA --title $releaseTitle --notes $releaseNotes --latest
          }

          $assetFiles = @()
          $assetFiles += Get-ChildItem $bundleRoot -Recurse -File -Include *.exe,*.msi,*.sig |
            Where-Object { $_.Name -notmatch "webview2|WebView2" }

          foreach ($asset in $assetFiles) {
            Write-Host "Uploading release asset: $($asset.FullName)"
            gh release upload $tag $asset.FullName --clobber
          }

          $encodedInstallerName = [System.Uri]::EscapeDataString($installer.Name)
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$encodedInstallerName"

          $manifest = [ordered]@{
            version = $version
            notes = $releaseNotes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $installerUrl
              }
            }
          }

          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($manifestPath, $json, [System.Text.UTF8Encoding]::new($false))

          Write-Host "Generated latest.json:"
          Get-Content $manifestPath -Raw

          gh release upload $tag $manifestPath --clobber
          Write-Host "Uploaded latest.json for $tag -> $installerUrl"

      - name: Verify latest.json release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $downloadDir = Join-Path $env:RUNNER_TEMP "updater-manifest-check"
          $manifestPath = Join-Path $downloadDir "latest.json"

          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          gh release download $tag --pattern "latest.json" --dir $downloadDir --clobber

          if (-not (Test-Path $manifestPath)) {
            throw "latest.json was not uploaded to GitHub Release $tag."
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $windows = $manifest.platforms.'windows-x86_64'

          if ($manifest.version -ne $version) {
            throw "latest.json version '$($manifest.version)' does not match package version '$version'."
          }

          if ([string]::IsNullOrWhiteSpace($windows.url)) {
            throw "latest.json is missing platforms.windows-x86_64.url."
          }

          if ([string]::IsNullOrWhiteSpace($windows.signature)) {
            throw "latest.json is missing platforms.windows-x86_64.signature."
          }

          Write-Host "Verified latest.json for $tag -> $($windows.url)"
