name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release

      - name: List artifacts
        run: ls -la release/

      - name: Debug - Check target repo
        run: |
          echo "=== Debug Info ==="
          echo "Target repo: 2026617199/jike-release"
          echo "Tag: ${{ github.ref_name }}"
          echo "GH_TOKEN exists: ${{ secrets.GH_TOKEN != '' }}"

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/*.exe,release/latest.yml,release/*.blockmap"
          repository: 2026617199/jike-release
          tag: ${{ github.ref_name }}
          name: 即刻 v${{ github.ref_name }}
          generateReleaseNotes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Debug - Check release result
        if: always()
        run: |
          echo "=== Release Result ==="
          echo "Release URL: ${{ steps.create_release.outputs.url }}"
