name: Release Build

# 触发：推送 v 开头的 tag 时运行
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  RUST_VERSION: 'stable'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run build:tauri

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bundle) {
            $bundle = Get-ChildItem -Path src-tauri/target/release -Recurse -Filter "jike-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($bundle) {
            "path=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "name=$($bundle.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "Installer not found"
            exit 1
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate.outputs.path }}
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src-tauri/target/release/build/**/*.log
          retention-days: 7
