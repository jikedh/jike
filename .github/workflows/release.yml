name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true
          key: windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match app version '$version'. Expected tag: '$expectedTag'. Update package.json/src-tauri/tauri.conf.json/src-tauri/Cargo.toml before tagging."
          }

          Write-Host "Release tag validated: $expectedTag"

      - name: Build and publish Tauri release
        id: tauri_release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: '即刻 v__VERSION__'
          releaseBody: '自动发布 Windows 安装包和 Tauri updater manifest。'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: '[platform]-[arch]-[bundle]'
          retryAttempts: 2

      - name: Print generated updater artifacts
        if: always()
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          if (Test-Path $bundleRoot) {
            Get-ChildItem $bundleRoot -Recurse -File |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize
          } else {
            Write-Host "Bundle output directory does not exist yet: $bundleRoot"
          }

      - name: Ensure latest.json release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $downloadDir = Join-Path $env:RUNNER_TEMP "updater-manifest-ensure"
          $manifestPath = Join-Path $downloadDir "latest.json"

          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null

          $latestJsonIsValid = $false
          try {
            gh release download $tag --pattern "latest.json" --dir $downloadDir --clobber
            if (Test-Path $manifestPath) {
              $existingManifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              $existingWindows = $existingManifest.platforms.'windows-x86_64'
              $latestJsonIsValid = `
                $existingManifest.version -eq $version -and `
                -not [string]::IsNullOrWhiteSpace($existingWindows.url) -and `
                -not [string]::IsNullOrWhiteSpace($existingWindows.signature)
            }
          } catch {
            Write-Host "latest.json is not available yet, fallback generation will run. Detail: $($_.Exception.Message)"
          }

          if ($latestJsonIsValid) {
            Write-Host "Release $tag already has a valid latest.json."
            exit 0
          }

          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          if (-not (Test-Path $bundleRoot)) {
            throw "Tauri bundle output directory was not found: $bundleRoot"
          }

          $nsisDir = Join-Path $bundleRoot "nsis"
          $msiDir = Join-Path $bundleRoot "msi"

          $installer = $null
          if (Test-Path $nsisDir) {
            $installer = Get-ChildItem $nsisDir -Recurse -File -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "webview2|WebView2" } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $installer -and (Test-Path $msiDir)) {
            $installer = Get-ChildItem $msiDir -Recurse -File -Filter "*.msi" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $installer) {
            throw "No Windows installer was found under $bundleRoot."
          }

          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Signature file was not found for installer: $($installer.FullName). Expected: $signaturePath"
          }

          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Signature file is empty: $signaturePath"
          }

          $assetsJson = gh release view $tag --json assets | ConvertFrom-Json
          $installerAsset = $assetsJson.assets | Where-Object { $_.name -eq $installer.Name } | Select-Object -First 1
          $signatureAsset = $assetsJson.assets | Where-Object { $_.name -eq (Split-Path $signaturePath -Leaf) } | Select-Object -First 1

          if (-not $installerAsset) {
            Write-Host "Installer asset is missing on release $tag. Uploading $($installer.Name)."
            gh release upload $tag $installer.FullName --clobber
          }

          if (-not $signatureAsset) {
            Write-Host "Signature asset is missing on release $tag. Uploading $(Split-Path $signaturePath -Leaf)."
            gh release upload $tag $signaturePath --clobber
          }

          $encodedInstallerName = [System.Uri]::EscapeDataString($installer.Name)
          $installerUrl = "https://github.com/$repo/releases/download/$tag/$encodedInstallerName"

          $manifest = [ordered]@{
            version = $version
            notes = "自动发布 Windows 安装包和 Tauri updater manifest。"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $installerUrl
              }
            }
          }

          $json = $manifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($manifestPath, $json, [System.Text.UTF8Encoding]::new($false))

          gh release upload $tag $manifestPath --clobber
          Write-Host "Generated and uploaded latest.json for $tag -> $installerUrl"

      - name: Verify latest.json release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $downloadDir = Join-Path $env:RUNNER_TEMP "updater-manifest-check"

          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          gh release download $tag --pattern "latest.json" --dir $downloadDir --clobber

          $manifestPath = Join-Path $downloadDir "latest.json"
          if (-not (Test-Path $manifestPath)) {
            throw "latest.json was not uploaded to GitHub Release $tag."
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $windows = $manifest.platforms.'windows-x86_64'

          if ($manifest.version -ne $version) {
            throw "latest.json version '$($manifest.version)' does not match package version '$version'."
          }

          if (-not $windows.url) {
            throw "latest.json is missing platforms.windows-x86_64.url."
          }

          if (-not $windows.signature) {
            throw "latest.json is missing platforms.windows-x86_64.signature."
          }

          Write-Host "Verified latest.json for $tag -> $($windows.url)"
