appId: com.jike.app
productName: 即刻
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/adobe2api-master/data/**'
  - '!resources/adobe2api-master/__pycache__/**'
  - '!resources/adobe2api-master/**/__pycache__/**'
  - '!resources/adobe2api-master/config/config.json'
  - '!resources/adobe2api-master/config/tokens.json'
  - '!resources/adobe2api-master/config/refresh_profile.json'
  - '!resources/adobe2api-master/tokens.json'
  - '!resources/python/**/__pycache__/**'
  - '!resources/python/**/*.pyc'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/adobe2api-master
    to: adobe2api-master
    filter:
      - '**/*'
      - '!data/**'
      - '!__pycache__/**'
      - '!**/__pycache__/**'
      - '!config/config.json'
      - '!config/tokens.json'
      - '!config/refresh_profile.json'
      - '!tokens.json'
  - from: resources/python
    to: python
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
win:
  executableName: 即刻
  icon: resources/icons/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
