appId: com.electron.app
productName: 即刻
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/**'
  - '!docs/**'
  - '!release/**'
  - '!out/**/*.map'
  - '!resources/**/*.psd'
  - '!resources/**/*.ai'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.editorconfig,.eslintcache,eslint.config.mjs,.gitignore,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,Dockerfile,nginx.conf}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.app.json,tsconfig.node.json,tsconfig.web.json}'
  - '!biome.json'
extraMetadata:
  main: out/main/index.js
asar: true
compression: maximum
asarUnpack:
  - resources/**
win:
  executableName: 即刻
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
