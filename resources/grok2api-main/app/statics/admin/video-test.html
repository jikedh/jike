<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grok 视频生成测试</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #111827;
      --accent-soft: #eef2ff;
      --danger: #b42318;
      --ok: #067647;
      --shadow: 0 18px 50px rgba(15, 23, 42, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(1180px, calc(100vw - 40px));
      margin: 32px auto;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .form { padding: 22px; }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .hint {
      margin: 0 0 18px;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
      color: #344054;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #98a2b3;
      box-shadow: 0 0 0 3px rgba(152, 162, 179, .18);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .72;
    }

    .result {
      min-height: 620px;
      padding: 22px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 28px;
      color: var(--muted);
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #98a2b3;
    }

    .status.loading .dot {
      background: #2563eb;
      animation: pulse 1s infinite ease-in-out;
    }

    .status.ok { color: var(--ok); }
    .status.ok .dot { background: var(--ok); }
    .status.error { color: var(--danger); }
    .status.error .dot { background: var(--danger); }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .55; }
      50% { transform: scale(1.6); opacity: 1; }
    }

    .video-wrap {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b0f16;
      min-height: 360px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-height: 620px;
      display: none;
      background: #000;
    }

    .empty {
      color: #98a2b3;
      padding: 30px;
      text-align: center;
    }

    .meta {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }

    .meta input {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      color: #344054;
      background: #f9fafb;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
        width: min(100vw - 24px, 720px);
        margin: 16px auto;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel form">
      <h1>Grok 视频生成测试</h1>
      <p class="hint">点生成后保持加载，完成后直接在右侧显示视频。</p>

      <label for="apiKey">API Key</label>
      <input id="apiKey" value="123123" autocomplete="off">

      <label for="prompt">提示词</label>
      <textarea id="prompt">一只赛博朋克风格的猫在雨夜霓虹街道上奔跑，电影感，高清</textarea>

      <div class="row">
        <div>
          <label for="seconds">时长</label>
          <select id="seconds">
            <option value="6">6 秒</option>
            <option value="10">10 秒</option>
            <option value="12">12 秒</option>
            <option value="16">16 秒</option>
            <option value="20">20 秒</option>
          </select>
        </div>
        <div>
          <label for="size">画幅</label>
          <select id="size">
            <option value="720x1280">9:16</option>
            <option value="1280x720">16:9</option>
            <option value="1024x1024">1:1</option>
            <option value="1024x1792">9:16 高</option>
            <option value="1792x1024">16:9 宽</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="resolution">清晰度</label>
          <select id="resolution">
            <option value="720p">720p</option>
            <option value="480p">480p</option>
          </select>
        </div>
        <div>
          <label for="preset">模式</label>
          <select id="preset">
            <option value="custom">custom</option>
            <option value="normal">normal</option>
            <option value="fun">fun</option>
            <option value="spicy">spicy</option>
          </select>
        </div>
      </div>

      <button id="generate">生成视频</button>
    </section>

    <section class="panel result">
      <div id="status" class="status">
        <span class="dot"></span>
        <span>等待生成</span>
      </div>
      <div class="video-wrap">
        <div id="empty" class="empty">生成完成后视频会出现在这里</div>
        <video id="video" controls></video>
      </div>
      <div class="meta">
        <label for="jobId">任务 ID</label>
        <input id="jobId" readonly>
        <label for="videoUrl">视频接口地址</label>
        <input id="videoUrl" readonly>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const button = $('generate');
    const video = $('video');
    const empty = $('empty');

    function setStatus(text, type = '') {
      statusEl.className = `status ${type}`;
      statusEl.querySelector('span:last-child').textContent = text;
    }

    function authHeaders() {
      return { Authorization: `Bearer ${$('apiKey').value.trim()}` };
    }

    async function readJson(response) {
      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
      if (!response.ok) {
        const message = data?.error?.message || data?.message || text || `HTTP ${response.status}`;
        throw new Error(message);
      }
      return data;
    }

    async function createJob() {
      const form = new FormData();
      form.append('model', 'grok-imagine-video');
      form.append('prompt', $('prompt').value.trim());
      form.append('seconds', $('seconds').value);
      form.append('size', $('size').value);
      form.append('resolution_name', $('resolution').value);
      form.append('preset', $('preset').value);

      const response = await fetch('/v1/videos', {
        method: 'POST',
        headers: authHeaders(),
        body: form,
      });
      return readJson(response);
    }

    async function getJob(id) {
      const response = await fetch(`/v1/videos/${encodeURIComponent(id)}`, {
        headers: authHeaders(),
      });
      return readJson(response);
    }

    async function loadVideo(id) {
      const url = `/v1/videos/${encodeURIComponent(id)}/content`;
      const response = await fetch(url, { headers: authHeaders() });
      if (!response.ok) {
        const data = await readJson(response);
        throw new Error(data?.error?.message || '视频读取失败');
      }
      const blob = await response.blob();
      video.src = URL.createObjectURL(blob);
      video.style.display = 'block';
      empty.style.display = 'none';
      $('videoUrl').value = `${location.origin}${url}`;
    }

    async function waitForDone(id) {
      const started = Date.now();
      while (Date.now() - started < 10 * 60 * 1000) {
        const job = await getJob(id);
        const progress = Number(job.progress || 0);
        if (job.status === 'completed') return job;
        if (job.status === 'failed') {
          throw new Error(job.error?.message || '视频生成失败');
        }
        setStatus(`生成中 ${progress}%`, 'loading');
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
      throw new Error('等待超时，视频还没有生成完成');
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      video.removeAttribute('src');
      video.style.display = 'none';
      empty.style.display = 'block';
      $('jobId').value = '';
      $('videoUrl').value = '';

      try {
        setStatus('正在创建视频任务', 'loading');
        const job = await createJob();
        $('jobId').value = job.id || '';
        setStatus('任务已创建，等待生成', 'loading');
        await waitForDone(job.id);
        setStatus('正在读取视频文件', 'loading');
        await loadVideo(job.id);
        setStatus('生成完成', 'ok');
      } catch (error) {
        setStatus(error.message || '生成失败', 'error');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
